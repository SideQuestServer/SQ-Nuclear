name: gametest

on:
  pull_request:

jobs:
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - run: ./gradlew runGameTestServer --no-daemon -Dorg.gradle.jvmargs=-Xmx3G
